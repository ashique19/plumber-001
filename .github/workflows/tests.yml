name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run suite (sqlite, excluding InstallSql MySQL testsuite)
        run: vendor/bin/pest --testsuite=Unit,Feature

  install-sql-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plumber_install_sql_smoke
          MYSQL_USER: fancy
          MYSQL_PASSWORD: fancytest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      INSTALL_SQL_MYSQL_HOST: 127.0.0.1
      INSTALL_SQL_MYSQL_PORT: 3306
      INSTALL_SQL_MYSQL_USER: fancy
      INSTALL_SQL_MYSQL_PASSWORD: fancytest
      INSTALL_SQL_MYSQL_DATABASE: plumber_install_sql_smoke
      INSTALL_SQL_MYSQL_ROOT_USER: root
      INSTALL_SQL_MYSQL_ROOT_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: fancy
      DB_PASSWORD: fancytest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -ufancy -pfancytest --silent && break
            sleep 2
          done
      - name: install.sql parity and MySQL route smoke
        run: |
          vendor/bin/pest tests/Feature/InstallSqlMigrationParityTest.php
          vendor/bin/pest --testsuite=InstallSql

  playwright-search-icon:
    if: false
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plumber_e2e
          MYSQL_USER: plumber_e2e
          MYSQL_PASSWORD: plumber_e2e_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: plumber_e2e
      DB_USERNAME: plumber_e2e
      DB_PASSWORD: plumber_e2e_test
      E2E_PORT: 8765
      E2E_BASE_URL: http://127.0.0.1:8765
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install Node dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -uplumber_e2e -pplumber_e2e_test --silent && break
            sleep 2
          done
      - name: Playwright admin UI checks
        run: npm run test:e2e -- tests/e2e/admin/
      - name: Upload Playwright admin screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-screenshots
          path: e2e-artifacts/**
          if-no-files-found: ignore
