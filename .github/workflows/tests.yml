name: Tests

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run suite (sqlite, excluding install-sql MySQL group)
        run: php artisan test --exclude-group=install-sql

  install-sql-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plumber_install_sql_smoke
          MYSQL_USER: fancy
          MYSQL_PASSWORD: fancytest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      INSTALL_SQL_MYSQL_HOST: 127.0.0.1
      INSTALL_SQL_MYSQL_PORT: 3306
      INSTALL_SQL_MYSQL_USER: fancy
      INSTALL_SQL_MYSQL_PASSWORD: fancytest
      INSTALL_SQL_MYSQL_DATABASE: plumber_install_sql_smoke
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: fancy
      DB_PASSWORD: fancytest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -ufancy -pfancytest --silent && break
            sleep 2
          done
      - name: install.sql parity and MySQL route smoke
        run: |
          php artisan test tests/Feature/InstallSqlMigrationParityTest.php
          php artisan test --group=install-sql
